<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lacto Works</title>
<meta name="description" content="Run a bioreactor growing Lactobacillus and fill orders for probiotics and lactic acid.">
<meta name="theme-color" content="#06070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lacto Works">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --bg:#06070b; --fg:#eef1f6; --dim:#8d96a8; --acc:#7bdc8a; --warn:#ffb347; --line:#262c3f; --panel:rgba(15,18,27,.9); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.35 -apple-system, system-ui, sans-serif; overflow:hidden; touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .top { position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 10px) 16px 0;
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .title { font-weight:700; font-size:17px; letter-spacing:.02em; }
  .title small { display:block; font-weight:400; color:var(--dim); font-size:12px; letter-spacing:0; }
  .panel { position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 12px);
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:8px 12px 10px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .row { display:flex; align-items:center; gap:10px; min-height:36px; }
  .row label { font-size:14px; min-width:52px; }
  .row output { font-size:13px; color:var(--dim); min-width:64px; text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { flex:1; height:28px; }
  #temp { accent-color:#ff8a5c; }
  #ph { accent-color:#b48cff; }
  input:disabled { opacity:.35; }
  button { appearance:none; border:1px solid var(--line); background:#141826; color:var(--fg);
    font:inherit; font-size:14px; padding:10px 8px; border-radius:11px; }
  button:active { transform:scale(.96); }
  button:disabled { opacity:.35; }
  button.on { border-color:var(--acc); background:rgba(123,220,138,.18); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#0b2410; font-weight:600; }
  .actions { display:flex; gap:8px; margin-top:6px; }
  .actions button { flex:1; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px;
    background:rgba(4,5,8,.72); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); }
  .overlay[hidden] { display:none; }
  .card { width:100%; max-width:380px; max-height:90vh; overflow:auto; background:#0f121b; border:1px solid var(--line);
    border-radius:18px; padding:20px; touch-action:pan-y; }
  .card h2 { margin:0 0 4px; font-size:21px; }
  .card .goal { font-size:14px; margin:0 0 10px; color:var(--acc); }
  .card p { margin:8px 0; color:#cdd3df; }
  .card .hint { color:#dcf5e0; background:rgba(123,220,138,.10); border-radius:10px; padding:10px 12px; font-size:14px; }
  .card .btns { display:flex; gap:8px; margin-top:14px; }
  .card .btns button { flex:1; }
  .lvl { display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; margin-top:8px; padding:12px 14px; }
  .lvl span:last-child { color:var(--warn); letter-spacing:2px; }
  .big { font-size:44px; font-weight:700; margin:6px 0 0; font-variant-numeric:tabular-nums; }
  .stars { font-size:28px; color:var(--warn); letter-spacing:4px; }
  .small { font-size:13px; color:var(--dim); }
  a { color:var(--acc); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <div class="title" id="lvlTitle">LACTO WORKS<small>Lactobacillus casei · 2 L bioreactor</small></div>
  <button id="menuBtn">Orders</button>
</div>

<div class="panel">
  <div class="row">
    <label for="temp">Heat</label>
    <input id="temp" type="range" min="20" max="50" step="0.5" value="37">
    <output id="tempOut"></output>
  </div>
  <div class="row">
    <label for="ph">pH set</label>
    <input id="ph" type="range" min="4.5" max="7.5" step="0.05" value="6.3">
    <output id="phOut"></output>
  </div>
  <div class="actions">
    <button id="baseBtn">Base</button>
    <button id="feedBtn">Feed</button>
    <button id="helpBtn">Hint</button>
    <button id="goBtn" class="primary">Inoculate</button>
  </div>
</div>

<div class="overlay" id="ov" hidden><div class="card" id="card"></div></div>

<script src="ferment.js"></script>
<script>
(() => {
  const F = window.Ferment;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const H_PER_SEC = 1;              // reactor hours per real second
  const FONT = '-apple-system, system-ui, sans-serif';

  // kind 'cells': scored on live cells at harvest; 'acid': on lactic acid titre
  const LEVELS = [
    { id: 'starter', name: 'Starter culture', kind: 'cells', target: 3e9, V0: 1.5, S0: 20, noBase: true, noFeed: true,
      intro: 'A dairy wants a yoghurt starter: a flask of live <i>Lactobacillus</i>. The bugs eat glucose and turn it into lactic acid, which sours the broth. A dash of bromocresol purple shows the pH: purple is neutral, yellow is acid.',
      hint: 'Inoculate and watch the green curve. The culture stops growing once the acid builds up, then the acid starts killing it. Harvest at the top of the curve.' },
    { id: 'capsule', name: 'Probiotic capsules', kind: 'cells', target: 7.5e9, V0: 1.5, S0: 20, noFeed: true,
      intro: 'Capsules need more than twice as many cells per mL. Acid is the limit: below pH 4.5 the cells stop growing, long before the sugar runs out.',
      hint: 'Turn on Base. The pump adds sodium hydroxide whenever the pH falls below the set point, so the bugs keep growing until all the glucose is gone. Then harvest: starving cells die too.' },
    { id: 'dense', name: 'High density', kind: 'cells', target: 4.5e10, V0: 1.2, S0: 20,
      intro: 'A freeze-drying plant wants a really thick culture. One flask of glucose won’t do it, so you’ll feed concentrated glucose (600 g/L) as you go. The vessel holds 2 L, and the feed and base both take up room.',
      hint: 'Feed too early and the sugar just piles up and fills the vessel before there are enough cells to eat it. Keep Base on, and start feeding once the culture is growing fast, around when the starting glucose is half gone.' },
    { id: 'pla', name: 'Bioplastic feedstock', kind: 'acid', target: 90, sugarMax: 5, V0: 1.5, S0: 30,
      intro: 'Lactic acid is polymerised into PLA, a compostable plastic. The plant wants at least 90 g/L of lactic acid, and leftover glucose spoils the purification: no more than 5 g/L at harvest.',
      hint: 'Feed while the culture is busy, then stop feeding so it can eat the last of the sugar before you harvest. Lactic acid itself slows the bugs down past about 80 g/L.' },
    { id: 'free', name: 'Free play', kind: 'cells', free: true, V0: 1.5, S0: 20,
      intro: 'No order: experiment. Try a run at 30 °C, or one at 45 °C.',
      hint: 'Lactobacilli grow fastest around 38 °C and die above about 44 °C. Most strains grow best between pH 6 and 6.5.' },
  ];

  let best = {};
  try { best = JSON.parse(localStorage.getItem('lacto-best') || '{}'); } catch (e) {}
  const saveBest = () => { try { localStorage.setItem('lacto-best', JSON.stringify(best)); } catch (e) {} };
  const stars = p => p >= 90 ? 3 : p >= 75 ? 2 : p >= 60 ? 1 : 0;
  const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
  const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  function sci(x, d = 1) {
    if (!(x > 0)) return '0';
    const e = Math.floor(Math.log10(x)), m = x / 10 ** e;
    return `${m.toFixed(d)}×10${String(e).split('').map(c => SUP[+c]).join('')}`;
  }

  let lvl, R, hist = [], done = false, cells = [], phase = 0, lastSample = -1;

  // ---------- layout ----------
  let W, H, dpr, panelTop, topBottom;
  function layout() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    panelTop = document.querySelector('.panel').getBoundingClientRect().top;
    topBottom = document.querySelector('.top').getBoundingClientRect().bottom;
  }

  // ---------- UI ----------
  $('temp').oninput = () => { R.setT = +$('temp').value; };
  $('ph').oninput = () => { R.pHset = +$('ph').value; };
  $('baseBtn').onclick = () => { if (done) return; R.baseOn = !R.baseOn; syncButtons(); };
  $('feedBtn').onclick = () => { if (done) return; R.feedOn = !R.feedOn; syncButtons(); };
  $('goBtn').onclick = () => {
    if (done) return;
    if (!R.inoculated) { F.inoculate(R); syncButtons(); return; }
    harvest();
  };
  $('helpBtn').onclick = () => {
    card(`<h2>Hint</h2><p class="hint">${lvl.hint}</p>
      <p class="small">Growth follows Monod kinetics, slowed by acid, by lactic acid itself, and by temperatures away from 38 °C.
      Lactic acid comes from growth plus a slower trickle from resting cells (Luedeking–Piret).
      Dead cells still make the broth cloudy, so the OD doesn’t tell you how many are alive.</p>
      <div class="btns"><button class="primary" id="ok">OK</button></div>`);
    $('ok').onclick = closeCard;
  };

  function syncButtons() {
    $('baseBtn').classList.toggle('on', R.baseOn);
    $('feedBtn').classList.toggle('on', R.feedOn);
    $('baseBtn').disabled = done || !!lvl.noBase;
    $('ph').disabled = done || !!lvl.noBase;
    $('feedBtn').disabled = done || !!lvl.noFeed;
    $('goBtn').textContent = R.inoculated ? 'Harvest' : 'Inoculate';
    $('goBtn').disabled = done;
  }

  function card(html) { $('card').innerHTML = html; $('ov').hidden = false; }
  function closeCard() { $('ov').hidden = true; }
  $('ov').addEventListener('pointerdown', e => { if (e.target === $('ov')) closeCard(); });

  function goalText(L) {
    if (L.free) return 'No order. Experiment.';
    if (L.kind === 'acid') return `Order: ≥ ${L.target} g/L lactic acid, ≤ ${L.sugarMax} g/L glucose left`;
    return `Order: ≥ ${sci(L.target)} live cells per mL`;
  }

  function loadLevel(i) {
    lvl = LEVELS[i]; lvl.index = i;
    R = F.makeReactor({ V0: lvl.V0, S0: lvl.S0, T: 37 });
    $('temp').value = 37; $('ph').value = R.pHset;
    hist = []; done = false; lastSample = -1; cells = [];
    for (let k = 0; k < 90; k++) cells.push({ a: Math.random() * 6.283, r: Math.sqrt(Math.random()), z: Math.random(), o: Math.random() * 6.283, s: 0.7 + Math.random() * 0.6 });
    $('lvlTitle').firstChild.textContent = lvl.name.toUpperCase();
    syncButtons();
    try { localStorage.setItem('lacto-level', i); } catch (e) {}
    layout();
    card(`<h2>${lvl.name}</h2><p class="goal">${goalText(lvl)}</p><p>${lvl.intro}</p>
      <p class="small">Heat sets the water jacket. Base runs a pH-stat at the set pH. Feed pumps in concentrated glucose.
      Inoculate starts the culture; Harvest ends the run and ships it. One second is one hour.</p>
      <div class="btns"><button class="primary" id="ok">Start</button></div>`);
    $('ok').onclick = closeCard;
  }

  function score() {
    const c = F.conc(R);
    if (lvl.kind === 'acid') {
      const fa = Math.min(1, c.P / lvl.target), fs = Math.max(0, 1 - Math.max(0, c.S - lvl.sugarMax) / 30);
      return Math.round(100 * fa * fs);
    }
    return Math.min(100, Math.round(100 * F.cfu(R) / lvl.target));
  }

  function harvest() {
    done = true; R.feedOn = false; R.baseOn = false; syncButtons();
    const c = F.conc(R), live = F.cfu(R), r = F.rates(R);
    const stats = `<p class="small">${R.t.toFixed(1)} h · ${sci(live)} live cells/mL (peak ${sci(R.peakCFU)}) ·
      OD ${F.od(R).toFixed(1)} · lactic acid ${c.P.toFixed(0)} g/L · glucose ${c.S.toFixed(1)} g/L ·
      pH ${R.pH.toFixed(2)} · ${R.V.toFixed(2)} L</p>`;
    if (lvl.free) {
      card(`<h2>Harvested</h2>${stats}<div class="btns"><button class="primary" id="retry">Again</button></div>`);
      $('retry').onclick = () => loadLevel(lvl.index);
      return;
    }
    const pct = score(), n = stars(pct);
    if (!best[lvl.id] || pct > best[lvl.id]) { best[lvl.id] = pct; saveBest(); }
    let why;
    if (n === 3) why = lvl.kind === 'acid' ? 'Clean, strong broth. The plastics plant is happy.' : 'A lively culture. The customer is delighted.';
    else if (lvl.kind === 'acid') {
      why = c.P < lvl.target * 0.9 ? `Only ${c.P.toFixed(0)} g/L of lactic acid.` + (R.full ? ' The vessel filled up.' : c.S < 1 ? ' The bugs ran out of glucose.' : '')
        : `${c.S.toFixed(0)} g/L of glucose left in the broth. Stop feeding earlier so the bugs can finish it.`;
    } else if (r.mu > 0.08 && live >= R.peakCFU * 0.98) why = 'Too early: the culture was still growing.';
    else if (live < R.peakCFU * 0.8 && R.peakCFU >= lvl.target * 0.9) {
      why = `Too late: the culture peaked at ${sci(R.peakCFU)} and has been dying since` +
        (R.pH < 4.5 ? ', poisoned by its own acid.' : c.S < 0.1 ? ', starving.' : R.T > 44 ? ', cooked.' : '.');
    } else if (R.pH < 4.6) why = `The acid stopped them: the pH fell to ${R.pH.toFixed(1)}.` + (lvl.noBase ? '' : ' Turn on the base pump.');
    else if (R.full) why = 'The vessel filled up before the cells could use the feed.';
    else if (R.T > 44) why = 'Too hot: lactobacilli die above about 44 °C.';
    else why = 'Not enough cells. They need more food.';
    const next = lvl.index + 1 < LEVELS.length ? `<button class="primary" id="next">Next order</button>` : '';
    card(`<h2>${lvl.name}</h2><div class="big">${pct}%</div><div class="stars">${starStr(n)}</div><p>${why}</p>${stats}
      <div class="btns"><button id="retry">Retry</button>${next}</div>`);
    $('retry').onclick = () => { loadLevel(lvl.index); closeCard(); };
    if (next) $('next').onclick = () => loadLevel(lvl.index + 1);
  }

  $('menuBtn').onclick = () => {
    const rows = LEVELS.map((L, i) => `<button class="lvl" data-i="${i}"><span>${i + 1}. ${L.name}</span>
        <span>${L.free ? '' : best[L.id] != null ? starStr(stars(best[L.id])) : ''}</span></button>`).join('');
    card(`<h2>Orders</h2>${rows}<p class="small" style="margin-top:14px">Also try <a href="../">Gyro</a>,
      <a href="../laser/">Laser Lab</a>, <a href="../qdots/">Dot Foundry</a> and <a href="../electrons/">Free Path</a>.</p>`);
    for (const b of document.querySelectorAll('.lvl')) b.onclick = () => loadLevel(+b.dataset.i);
  };

  // ---------- drawing ----------
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  // bromocresol purple: yellow below pH ~5.2, purple above ~6.8 (pKa 6.3)
  const indicator = pH => mix([226, 196, 52], [118, 52, 150], 1 / (1 + 10 ** (6.3 - pH)));

  function rrect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function vesselPath(x, y, w, h, rb) {
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h - rb);
    ctx.quadraticCurveTo(x, y + h, x + rb, y + h); ctx.lineTo(x + w - rb, y + h);
    ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - rb); ctx.lineTo(x + w, y);
  }

  function bottle(x, y, w, h, level, col, label, active) {
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; rrect(x, y, w, h, 5); ctx.fill();
    ctx.save(); rrect(x, y, w, h, 5); ctx.clip();
    ctx.fillStyle = rgba(col, active ? 0.75 : 0.45); ctx.fillRect(x, y + h * (1 - level), w, h * level);
    ctx.restore();
    ctx.strokeStyle = 'rgba(210,225,240,0.45)'; ctx.lineWidth = 1.5; rrect(x, y, w, h, 5); ctx.stroke();
    ctx.fillStyle = 'rgba(210,225,240,0.45)'; ctx.fillRect(x + w * 0.3, y - 5, w * 0.4, 5);
    ctx.fillStyle = active ? '#eef1f6' : '#8d96a8'; ctx.font = `11px ${FONT}`; ctx.textAlign = 'center';
    for (const [k, s] of label.entries()) ctx.fillText(s, x + w / 2, y + h + 14 + 13 * k);
  }

  function drawReactor(top, bottom, dt) {
    const avail = bottom - top;
    const vw = Math.max(70, Math.min(W * 0.4, avail * 0.6)), cx = W / 2;
    const motorH = Math.min(28, avail * 0.1);
    const y0 = top + motorH + 10, vb = bottom - 4, vh = vb - y0, x0 = cx - vw / 2, rb = vw * 0.22;
    const c = F.conc(R), od = F.od(R);
    const lt = vb - vh * 0.94 * Math.min(1, R.V / R.Vmax);      // liquid surface

    // water jacket, tinted by temperature
    const tj = Math.max(0, Math.min(1, (R.T - 20) / 30));
    const jc = mix([70, 140, 255], [255, 110, 50], tj);
    ctx.fillStyle = rgba(jc, 0.13 + 0.12 * Math.abs(tj - 0.4));
    vesselPath(x0 - 9, y0 + vh * 0.12, vw + 18, vh * 0.88 + 7, rb + 8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba(jc, 0.35); ctx.lineWidth = 1;
    vesselPath(x0 - 9, y0 + vh * 0.12, vw + 18, vh * 0.88 + 7, rb + 8); ctx.stroke();

    // broth
    ctx.save();
    vesselPath(x0, y0, vw, vh, rb); ctx.closePath(); ctx.clip();
    ctx.fillStyle = '#090b10'; ctx.fillRect(x0, y0, vw, vh);
    const turb = Math.min(0.82, 1 - Math.exp(-od / 9));
    const broth = mix(indicator(R.pH), [236, 228, 208], turb);
    const bg = ctx.createLinearGradient(x0, 0, x0 + vw, 0);
    bg.addColorStop(0, rgba(broth, 0.55)); bg.addColorStop(0.45, rgba(broth, 0.8)); bg.addColorStop(1, rgba(broth, 0.5));
    ctx.fillStyle = bg; ctx.fillRect(x0, lt, vw, vb - lt + 2);
    // vortex dimple at the surface
    ctx.fillStyle = '#090b10';
    ctx.beginPath(); ctx.ellipse(cx, lt, vw * 0.18, 4, 0, 0, Math.PI); ctx.fill();

    // cells: rods swirling with the flow; grey ones are dead
    const tot = R.X / R.V * 2.5e9, live = F.cfu(R);
    const nTot = R.inoculated ? Math.max(0, Math.min(cells.length, Math.round(18 * (Math.log10(tot) - 7.2)))) : 0;
    const nLive = tot > 0 ? Math.round(nTot * live / tot) : 0;
    const rIn = vw / 2 - 6;
    for (let k = 0; k < nTot; k++) {
      const p = cells[k];
      p.a += dt * (1.2 + 0.8 * (1 - p.r)); p.o += dt * 1.5 * (p.s - 1) * 4; p.z += dt * 0.04 * Math.sin(p.a * 0.7 + k);
      p.z = Math.min(1, Math.max(0, p.z));
      const x = cx + rIn * p.r * Math.cos(p.a), y = lt + 10 + p.z * (vb - lt - 18);
      const front = Math.sin(p.a) > 0, L = 4.5 * p.s;
      ctx.strokeStyle = k < nLive ? `rgba(70,120,60,${front ? 0.95 : 0.5})` : `rgba(120,115,105,${front ? 0.6 : 0.3})`;
      ctx.lineWidth = 2.6 * (front ? 1 : 0.8); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - L * Math.cos(p.o), y - L * Math.sin(p.o)); ctx.lineTo(x + L * Math.cos(p.o), y + L * Math.sin(p.o)); ctx.stroke();
    }

    // baffles
    ctx.fillStyle = 'rgba(200,210,225,0.25)';
    ctx.fillRect(x0 + 4, y0 + vh * 0.15, 3, vh * 0.7); ctx.fillRect(x0 + vw - 7, y0 + vh * 0.15, 3, vh * 0.7);
    ctx.restore();

    // shaft and two Rushton turbines
    const spin = R.inoculated || R.T !== R.setT ? 1 : 0.6;
    phase += dt * 9 * spin;
    ctx.strokeStyle = '#9aa3b4'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, y0 - 4); ctx.lineTo(cx, vb - vh * 0.12); ctx.stroke();
    const ir = vw * 0.17;
    for (const hz of [0.88, 0.55]) {
      const iy = vb - vh * (1 - hz) - 4;
      ctx.strokeStyle = '#7d8696'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(cx, iy, ir * 0.62, 2.5, 0, 0, 7); ctx.stroke();
      for (let b = 0; b < 6; b++) {
        const a = phase + b * Math.PI / 3, s = Math.sin(a), bx = cx + ir * Math.cos(a), bw = 2 + ir * 0.45 * Math.abs(s);
        ctx.fillStyle = s > 0 ? '#c4ccd8' : '#5d6574';
        ctx.fillRect(bx - bw / 2, iy - 6, bw, 12);
      }
    }

    // probes
    const probe = (px, label, col) => {
      ctx.fillStyle = '#2b3142'; ctx.fillRect(px - 3, y0 - 6, 6, vh * 0.62);
      ctx.fillStyle = col; ctx.fillRect(px - 3, y0 - 6 + vh * 0.62 - 7, 6, 7);
      ctx.fillStyle = '#8d96a8'; ctx.font = `10px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(label, px, y0 - 10);
    };
    probe(cx - vw * 0.3, 'T', '#ff8a5c');
    probe(cx + vw * 0.3, 'pH', '#b48cff');

    // glass
    ctx.strokeStyle = 'rgba(210,225,240,0.55)'; ctx.lineWidth = 2.5;
    vesselPath(x0, y0, vw, vh, rb); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x0 + vw * 0.1, y0 + vh * 0.12); ctx.lineTo(x0 + vw * 0.1, vb - rb); ctx.stroke();
    // volume marks
    ctx.fillStyle = '#8d96a8'; ctx.font = `10px ${FONT}`; ctx.textAlign = 'left';
    for (const v of [0.5, 1, 1.5, 2]) {
      const y = vb - vh * 0.94 * v / R.Vmax;
      ctx.fillRect(x0 + vw - 14, y, 9, 1);
    }
    ctx.textAlign = 'right'; ctx.fillStyle = R.full ? '#ff6b6b' : '#cfd5e0';
    ctx.fillText(`${R.V.toFixed(2)} L`, x0 + vw - 16, lt + 13);

    // head plate and motor
    ctx.fillStyle = '#3a4152'; rrect(x0 - 6, y0 - 8, vw + 12, 9, 3); ctx.fill();
    ctx.fillStyle = '#262c3a'; rrect(cx - 14, y0 - 8 - motorH, 28, motorH, 4); ctx.fill();
    ctx.strokeStyle = '#4b5366'; ctx.lineWidth = 1; rrect(cx - 14, y0 - 8 - motorH, 28, motorH, 4); ctx.stroke();

    // reservoirs and tubing
    const bwid = Math.min(34, (W - vw) / 2 - 34), bh = Math.min(70, vh * 0.42), by = y0 + vh * 0.25;
    if (bwid > 16) {
      const lx = x0 - 22 - bwid, rx = x0 + vw + 22;
      const baseActive = R.baseFlow > 0.002 && !done, feedActive = R.feedOn && !R.full && !done;
      bottle(lx, by, bwid, bh, Math.max(0.05, 1 - R.base / 3.5), [150, 190, 255], ['NaOH', '10 M'], baseActive);
      bottle(rx, by, bwid, bh, Math.max(0.05, 1 - (R.fed / R.feedConc) / 0.7), [235, 220, 140], ['Glucose', '600 g/L'], feedActive);
      ctx.strokeStyle = 'rgba(200,210,225,0.3)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(lx + bwid / 2, by - 5); ctx.lineTo(lx + bwid / 2, y0 - 22); ctx.lineTo(x0 + vw * 0.12, y0 - 22); ctx.lineTo(x0 + vw * 0.12, y0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx + bwid / 2, by - 5); ctx.lineTo(rx + bwid / 2, y0 - 22); ctx.lineTo(x0 + vw * 0.88, y0 - 22); ctx.lineTo(x0 + vw * 0.88, y0); ctx.stroke();
      const drip = (x, col, speed) => {
        const ph = (performance.now() / speed) % 1;
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y0 + ph * (lt - y0), 2.4, 0, 7); ctx.fill();
      };
      if (baseActive) drip(x0 + vw * 0.12, 'rgba(170,200,255,0.9)', 350);
      if (feedActive) drip(x0 + vw * 0.88, 'rgba(240,225,150,0.9)', 500);
    }

    if (!R.inoculated) {
      ctx.fillStyle = '#cfd5e0'; ctx.font = `14px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText('Tap Inoculate to add the bugs', cx, (lt + vb) / 2);
    }
  }

  function drawReadouts(y) {
    const c = F.conc(R);
    ctx.textAlign = 'center';
    if (!lvl.free) {
      ctx.fillStyle = '#7bdc8a'; ctx.font = `600 14px ${FONT}`;
      ctx.fillText(goalText(lvl), W / 2, y);
    }
    ctx.fillStyle = '#cfd5e0'; ctx.font = `13px ${FONT}`;
    ctx.fillText([`${R.T.toFixed(1)} °C`, `pH ${R.pH.toFixed(2)}`, `t = ${R.t.toFixed(1)} h`].join('   ·   '), W / 2, y + 20);
    const parts = lvl.kind === 'acid'
      ? [`lactic ${c.P.toFixed(0)} g/L`, `glucose ${c.S.toFixed(1)} g/L`]
      : [`${sci(F.cfu(R))} live/mL`, `glucose ${c.S.toFixed(1)} g/L`];
    ctx.fillText(parts.join('   ·   '), W / 2, y + 38);
    if (R.full && !done) { ctx.fillStyle = '#ff6b6b'; ctx.fillText('Vessel full: pumps stopped', W / 2, y + 56); }
  }

  function drawChart(x0, y0, w, h) {
    ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(x0, y0, w, h);
    const tmax = Math.max(24, Math.ceil((R.t + 3) / 6) * 6);
    const X = t => x0 + t / tmax * w;
    const acid = lvl.kind === 'acid';
    const Yl = acid ? v => y0 + h - v / 120 * h : v => y0 + h - (v - 7) / 4.8 * h;    // left axis
    const Yp = p => y0 + h - (p - 3.5) / 3.5 * h;                                   // pH axis
    ctx.font = `10px ${FONT}`; ctx.fillStyle = '#8d96a8';
    ctx.textAlign = 'center';
    for (let t = 0; t <= tmax; t += tmax > 36 ? 12 : 6) ctx.fillText(`${t}`, X(t), y0 + h + 13);
    ctx.textAlign = 'right'; ctx.fillText('hours', x0 + w, y0 + h + 26);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    ctx.textAlign = 'left';
    const ticks = acid ? [30, 60, 90] : [8, 9, 10];
    for (const v of ticks) {
      ctx.beginPath(); ctx.moveTo(x0, Yl(v)); ctx.lineTo(x0 + w, Yl(v)); ctx.stroke();
      ctx.fillText(acid ? `${v}` : '10' + String(v).split('').map(d => SUP[+d]).join(''), x0 + 3, Yl(v) - 2);
    }
    ctx.textAlign = 'right';
    for (const p of [4, 5, 6]) ctx.fillText(`pH ${p}`, x0 + w - 3, Yp(p) - 3);
    // target
    if (!lvl.free) {
      const ty = acid ? Yl(lvl.target) : Yl(Math.log10(lvl.target));
      ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(255,179,71,0.8)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x0, ty); ctx.lineTo(x0 + w, ty); ctx.stroke(); ctx.setLineDash([]);
    }
    const line = (fy, col, lw) => {
      if (hist.length < 2) return;
      ctx.beginPath();
      hist.forEach((s, i) => { const x = X(s.t), y = Math.max(y0, Math.min(y0 + h, fy(s))); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
    };
    line(s => Yp(s.pH), 'rgba(180,140,255,0.9)', 1.5);
    if (acid) { line(s => Yl(s.S), 'rgba(235,220,140,0.8)', 1.2); line(s => Yl(s.P), '#ffb347', 2); }
    else line(s => Yl(s.lc), '#7bdc8a', 2);
    // legend
    ctx.font = `600 11px ${FONT}`; ctx.textAlign = 'left';
    const leg = acid ? [['lactic g/L', '#ffb347'], ['glucose', 'rgba(235,220,140,0.9)'], ['pH', '#b48cff']]
                     : [['live cells/mL', '#7bdc8a'], ['pH', '#b48cff']];
    let lx = x0 + 6;
    for (const [s, col] of leg) { ctx.fillStyle = col; ctx.fillText(s, lx, y0 + 13); lx += ctx.measureText(s).width + 12; }
  }

  function sample() {
    const c = F.conc(R);
    hist.push({ t: R.t, pH: R.pH, lc: Math.log10(Math.max(1, F.cfu(R))), S: c.S, P: c.P });
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const paused = !$('ov').hidden;
    if (!done && !paused) {
      if (R.inoculated) {
        F.step(R, dt * H_PER_SEC);
        if (R.t - lastSample >= 0.1) { sample(); lastSample = R.t; }
      } else {
        // before inoculation only the jacket temperature moves
        R.T += (R.setT - R.T) * Math.min(1, dt * H_PER_SEC / 0.25);
      }
    }
    $('tempOut').textContent = `${(+$('temp').value).toFixed(1)} °C`;
    $('phOut').textContent = lvl.noBase ? 'no pump' : `${(+$('ph').value).toFixed(2)}`;
    ctx.fillStyle = '#06070b'; ctx.fillRect(0, 0, W, H);
    const chartH = Math.max(80, Math.min(140, (panelTop - topBottom) * 0.27));
    const chartY = panelTop - chartH - 34;
    drawReadouts(topBottom + 20);
    drawReactor(topBottom + 84, chartY - 22, paused ? 0 : dt);
    drawChart(16, chartY, W - 32, chartH);
    requestAnimationFrame(frame);
  }

  addEventListener('resize', layout);
  let start = 0;
  try { start = Math.min(LEVELS.length - 1, +(localStorage.getItem('lacto-level') || 0)); } catch (e) {}
  loadLevel(start);
  requestAnimationFrame(frame);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('../sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
